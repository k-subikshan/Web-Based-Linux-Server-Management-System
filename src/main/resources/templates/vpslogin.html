<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e293b,#0f172a);
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#222;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#444;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="login-box">

    <h2>VPS Login</h2>

    <form action="/connect" method="post">

        <div class="input-group">
            <label>Server IP</label>
            <input type="text" name="host" placeholder="192.168.1.100" id="ip" required>
        </div>

        <div class="input-group">
            <label>SSH Port</label>
            <input type="number" name="port" value="22" id="port" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" id="password" required>
        </div>
        <div class="input-group">
            <label>Path</label>
            <input type="text" name="path" placeholder="Enter Path" id="path" required>
        </div>

        <button type="submit">Connect to VPS</button>

    </form>

</div>

</body>
</html>
